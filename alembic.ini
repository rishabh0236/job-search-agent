[alembic]
script_location = migrations
prepend_sys_path = .
# Split prepend_sys_path with os.pathsep rather than alembic's legacy
# space/comma/colon splitting, which is deprecated.
path_separator = os
# The URL is read from CA_DATABASE_URL in migrations/env.py, not duplicated here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
